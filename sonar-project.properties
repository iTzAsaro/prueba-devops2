# Configuración de SonarQube / SonarCloud para EP2 DevOps
sonar.projectKey=iTzAsaro_prueba-devops2
sonar.organization=itzasaro
sonar.projectName=prueba-devops2
sonar.projectVersion=2.0.0
sonar.host.url=https://sonarcloud.io

# Rutas de código fuente y pruebas
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/tests

# Codificación
sonar.sourceEncoding=UTF-8

# Exclusiones de análisis general (archivos estáticos, dependencias y documentación)
sonar.exclusions=**/node_modules/**,**/public/**,docs/**,**/*.md,**/*.json
sonar.test.inclusions=**/*.test.js

# Exclusiones de cobertura (Frontend es SPA cliente sin entorno headless; backend gestiona la cobertura del microservicio)
sonar.coverage.exclusions=frontend/**,**/tests/**

# Rutas de reportes de cobertura LCOV
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Calidad y umbrales de severidad
sonar.qualitygate.wait=true
