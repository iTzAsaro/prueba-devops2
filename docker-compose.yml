version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: devops_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vicity_network

  frontend:
    build:
      context: ./frontend
    container_name: devops_frontend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - BACKEND_URL=http://backend:3000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vicity_network

networks:
  vicity_network:
    driver: bridge
